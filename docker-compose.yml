services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  service-a:
    build:
      dockerfile: ./services/service-a/Dockerfile
    container_name: service-a
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000

  service-b:
    build:
      dockerfile: ./services/service-b/Dockerfile
    container_name: service-b
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  service-c:
    build:
      dockerfile: ./services/service-c/Dockerfile
    container_name: service-c
    ports:
      - "5001:5001"
      - "9091:9091"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5001
      - METRICS_PORT=9091

volumes:
  redis-data: